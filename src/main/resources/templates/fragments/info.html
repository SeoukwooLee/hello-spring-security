<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!-- 실습 정보 헤더: 모든 페이지 상단에 학번/성명/실시간 시각 표시 -->
<div th:fragment="header" class="bg-dark text-white text-center py-1">
    <small th:text="${'학번: 1971377 │ 성명: 이석우 │ 실습 일시: '
                     + #temporals.format(#temporals.createNow(), 'yyyy-MM-dd HH:mm:ss')}">
        학번: 1971377 │ 성명: 이석우 │ 실습 일시: 0000-00-00 00:00:00
    </small>
</div>

<!-- 실습 정보 푸터: 동일 정보를 페이지 하단에도 표시 -->
<footer th:fragment="footer" class="container py-3 mt-5 border-top">
    <p class="text-center text-muted small mb-0"
       th:text="${'실습 수행 일시: '
                  + #temporals.format(#temporals.createNow(), 'yyyy년 MM월 dd일 HH:mm:ss')
                  + ' │ 학번: 1971377 │ 성명: 이석우'}">
        실습 수행 일시: 0000-00-00 00:00:00 │ 학번: 1971377 │ 성명: 이석우
    </p>
</footer>

</body>
</html>
